# ============================================================================
# Post-installation steps:
# ============================================================================
# 1. Download spaCy language models:
#    python -m spacy download en_core_web_sm
#
# 2. For GPU support:
#    - Remove 'cpuonly' dependency
#    - Add: pytorch-cuda=12.1 (or appropriate CUDA version)
#    - Use faiss-gpu instead of faiss-cpu
#
# 3. For vector databases:
#    - Some require Docker for local development
#    - Check individual documentation for setup
#
# 4. Platform-specific packages (not included above):
#    - vllm: Linux-only, no macOS wheels
#    - bitsandbytes: best support on Linux with CUDA
#    - flash-attn: requires CUDA (Linux only)
#    - apache-airflow: heavy; install separately if needed
#    - TTS: requires espeak-ng system package on Linux
#    - unsloth: may require specific torch/CUDA versions

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>
  <rect width="1200" height="630" fill="url(#grad)" opacity="0.6"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#3F51B5"/>
      <stop offset="100%" stop-color="#7986cb"/>
    </linearGradient>
  </defs>

  <!-- Logo mark -->
  <rect x="80" y="160" width="80" height="80" rx="16" fill="#fff" opacity="0.15"/>
  <text x="120" y="210" dominant-baseline="central" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="32" fill="white">0→AI</text>

  <!-- Title -->
  <text x="190" y="195" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="54" fill="white">Zero to AI</text>
  <text x="190" y="235" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="22" fill="#b0bec5">Free Open-Source AI/ML Course</text>

  <!-- Stats row -->
  <text x="120" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="48" fill="white">950+</text>
  <text x="120" y="370" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="16" fill="#b0bec5">Notebooks</text>

  <text x="340" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="48" fill="white">31</text>
  <text x="340" y="370" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="16" fill="#b0bec5">Phases</text>

  <text x="540" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="48" fill="white">3</text>
  <text x="540" y="370" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="16" fill="#b0bec5">Tracks</text>

  <!-- Topic pills -->
  <rect x="80" y="420" width="120" height="36" rx="18" fill="#fff" opacity="0.12"/>
  <text x="140" y="443" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="white">Python</text>

  <rect x="216" y="420" width="160" height="36" rx="18" fill="#fff" opacity="0.12"/>
  <text x="296" y="443" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="white">Deep Learning</text>

  <rect x="392" y="420" width="90" height="36" rx="18" fill="#fff" opacity="0.12"/>
  <text x="437" y="443" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="white">LLMs</text>

  <rect x="498" y="420" width="90" height="36" rx="18" fill="#fff" opacity="0.12"/>
  <text x="543" y="443" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="white">RAG</text>

  <rect x="604" y="420" width="130" height="36" rx="18" fill="#fff" opacity="0.12"/>
  <text x="669" y="443" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="white">AI Agents</text>

  <rect x="750" y="420" width="120" height="36" rx="18" fill="#fff" opacity="0.12"/>
  <text x="810" y="443" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="white">MLOps</text>

  <rect x="886" y="420" width="160" height="36" rx="18" fill="#fff" opacity="0.12"/>
  <text x="966" y="443" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="white">Fine-Tuning</text>

  <!-- URL footer -->
  <text x="120" y="560" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="20" fill="#7986cb">zero-to-ai.dev</text>
  <text x="1080" y="560" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="16" fill="#b0bec5">github.com/PavanMudigonda/zero-to-ai</text>
</svg>

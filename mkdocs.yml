site_name: Zero to AI
site_url: https://pavanmudigonda.github.io/zero-to-ai/
site_description: A comprehensive curriculum from Python fundamentals to production-ready AI systems
site_author: Pavan Mudigonda
repo_url: https://github.com/PavanMudigonda/zero-to-ai
repo_name: PavanMudigonda/zero-to-ai
edit_uri: edit/main/

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
      allow_errors: true
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PavanMudigonda
      name: GitHub
  generator: false

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - Course Setup: curriculum/00-course-setup/index.md
      - Installation: setup.md
      - Checklist: checklist.md
  - Learning Tracks:
      - Study Guide: MASTER_STUDY_GUIDE.md
      - Career Roadmap: CAREER_ROADMAP.md
      - Interview Prep: INTERVIEW_PREP.md
  - Curriculum:
      - Foundations:
          - "Phase 0: Course Setup": curriculum/00-course-setup/index.md
          - "Phase 1: Python": curriculum/01-python/index.md
          - "Phase 2: Data Science": curriculum/02-data-science/index.md
          - "Phase 3: Mathematics": curriculum/03-maths/index.md
      - Core AI:
          - "Phase 4: Tokenization": curriculum/04-token/index.md
          - "Phase 5: Embeddings": curriculum/05-embeddings/index.md
          - "Phase 6: Neural Networks": curriculum/06-neural-networks/index.md
      - Applied AI:
          - "Phase 7: Vector Databases": curriculum/07-vector-databases/index.md
          - "Phase 8: RAG Systems": curriculum/08-rag/index.md
          - "Phase 9: MLOps": curriculum/09-mlops/index.md
          - "Phase 10: Specializations": curriculum/10-specializations/index.md
      - Advanced:
          - "Phase 11: Prompt Engineering": curriculum/11-prompt-engineering/index.md
          - "Phase 12: LLM Fine-tuning": curriculum/12-llm-finetuning/index.md
          - "Phase 13: Multimodal AI": curriculum/13-multimodal/index.md
          - "Phase 14: Local LLMs": curriculum/14-local-llms/index.md
          - "Phase 15: AI Agents": curriculum/15-ai-agents/index.md
      - Supplementary:
          - "Phase 16: Model Evaluation": curriculum/16-model-evaluation/index.md
          - "Phase 17: Debugging": curriculum/17-debugging/index.md
          - "Phase 18: Low-Code AI Tools": curriculum/18-low-code/index.md
          - "Phase 19: AI Safety": curriculum/19-ai-safety/index.md
          - "Phase 20: Real-Time Streaming": curriculum/20-streaming/index.md
      - Reference:
          - "Phase 21: Quizzes": curriculum/21-quizzes/index.md
          - "Phase 22: References": curriculum/22-references/index.md
          - "Phase 23: Glossary": curriculum/23-glossary/index.md
      - Research:
          - "Phase 24: Advanced Deep Learning": curriculum/24-advanced-dl/index.md
          - "Phase 25: Reinforcement Learning": curriculum/25-rl/index.md
          - "Phase 26: Time Series": curriculum/26-time-series/index.md
          - "Phase 27: Causal Inference": curriculum/27-causal-inference/index.md
      - Production:
          - "Phase 28: Practical Data Science": curriculum/28-practical-ds/index.md
          - "Phase 29: AI Hardware": curriculum/29-ai-hardware/index.md

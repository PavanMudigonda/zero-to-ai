# Complete Pod specification with explanations
apiVersion: v1                    # Kubernetes API version
kind: Pod                         # Resource type
metadata:                         # Metadata about the pod
  name: my-app                    # Pod name (unique in namespace)
  namespace: default              # Namespace (default if not specified)
  labels:                         # Key-value pairs for organization
    app: frontend
    tier: web
    environment: production
  annotations:                    # Non-identifying metadata
    description: "Main web application"
    version: "1.0.0"

spec:                             # Pod specification
  containers:                     # List of containers in this pod
  - name: app-container           # Container name
    image: nginx:1.21             # Docker image
    imagePullPolicy: IfNotPresent # Always, Never, or IfNotPresent
    
    ports:                        # Exposed ports (informational)
    - containerPort: 80
      name: http
      protocol: TCP
    
    env:                          # Environment variables
    - name: ENV
      value: "production"
    - name: DB_HOST
      value: "postgres.default.svc.cluster.local"
    
    resources:                    # Resource requests and limits
      requests:                   # Minimum guaranteed resources
        cpu: 100m                 # 0.1 CPU cores
        memory: 128Mi             # 128 megabytes
      limits:                     # Maximum allowed resources
        cpu: 500m                 # 0.5 CPU cores
        memory: 512Mi             # 512 megabytes
    
    livenessProbe:                # Health check (restart if fails)
      httpGet:
        path: /healthz
        port: 80
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    
    readinessProbe:               # Ready to serve traffic?
      httpGet:
        path: /ready
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
    
    volumeMounts:                 # Mount volumes into container
    - name: config-volume
      mountPath: /etc/config
    - name: data-volume
      mountPath: /data
  
  restartPolicy: Always           # Always, OnFailure, or Never
  
  volumes:                        # Volumes available to containers
  - name: config-volume
    configMap:
      name: app-config
  - name: data-volume
    emptyDir: {}                  # Temporary volume (deleted with pod)

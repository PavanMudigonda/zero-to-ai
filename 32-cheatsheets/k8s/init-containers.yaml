apiVersion: v1
kind: Pod
metadata:
  name: app-with-init
  labels:
    app: myapp
spec:
  
  # Init containers run BEFORE app containers
  initContainers:
  
  # Init 1: Wait for database to be ready
  - name: wait-for-db
    image: busybox:1.28
    command: ['sh', '-c']
    args:
    - |
      echo "Waiting for database..."
      until nslookup postgres.default.svc.cluster.local; do
        echo "Database not ready, waiting..."
        sleep 2
      done
      echo "Database is ready!"
  
  # Init 2: Run database migrations
  - name: db-migration
    image: myapp:1.0
    command: ['python', 'manage.py', 'migrate']
    env:
    - name: DB_HOST
      value: postgres.default.svc.cluster.local
  
  # Init 3: Download configuration from remote
  - name: download-config
    image: busybox:1.28
    command: ['sh', '-c']
    args:
    - |
      wget -O /config/app.conf https://config-server/app.conf
      echo "Config downloaded"
    volumeMounts:
    - name: config
      mountPath: /config
  
  # Main application containers (start AFTER all init containers succeed)
  containers:
  - name: app
    image: myapp:1.0
    ports:
    - containerPort: 8080
    volumeMounts:
    - name: config
      mountPath: /etc/app
    env:
    - name: DB_HOST
      value: postgres.default.svc.cluster.local
  
  volumes:
  - name: config
    emptyDir: {}

---
# Execution order:
# 1. wait-for-db runs → exits 0
# 2. db-migration runs → exits 0
# 3. download-config runs → exits 0
# 4. app container starts
#
# If any init container fails, the pod restarts and tries again

apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  labels:
    app: webapp
spec:
  containers:
  
  # Main application container
  - name: app
    image: nginx:1.21
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx
  
  # Sidecar: Log collector
  - name: log-collector
    image: busybox:1.28
    command: ["sh", "-c"]
    args:
    - |
      # Tail the access logs and send to stdout
      tail -f /var/log/nginx/access.log
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx
  
  # Sidecar: Metrics exporter
  - name: metrics-exporter
    image: nginx/nginx-prometheus-exporter:0.10.0
    args:
    - "-nginx.scrape-uri=http://localhost:80/stub_status"
    ports:
    - containerPort: 9113
      name: metrics
  
  volumes:
  - name: shared-logs
    emptyDir: {}  # Shared volume for logs

---
# How containers communicate within this pod:
# 
# 1. app container runs nginx on port 80
# 2. metrics-exporter accesses http://localhost:80 (same network namespace)
# 3. Both app and log-collector share /var/log/nginx volume
# 4. log-collector reads logs written by app
#
# Access pattern:
# - External traffic → app container (port 80)
# - Prometheus → metrics-exporter (port 9113)
# - log-collector → reads shared volume

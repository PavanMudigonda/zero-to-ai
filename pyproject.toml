[project]
name = "zero-to-ai"
version = "0.1.0"
description = "Comprehensive AI/ML learning path from zero to production"
authors = [
    {name = "Pavan Mudigonda", email = "mnpawan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = [
    "machine-learning",
    "deep-learning",
    "artificial-intelligence",
    "rag",
    "llm",
    "ai-agents",
    "pytorch",
    "data-science",
    "neural-networks",
    "prompt-engineering",
    "computer-vision",
    "nlp",
    "large-language-models",
    "fine-tuning",
    "mlops",
    "python",
    "transformers",
    "openai",
    "embeddings",
    "vector-database"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    # Core ML/DL
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "torchaudio>=2.5.1",
    "transformers>=4.48.0",
    "datasets>=3.2.1",
    # Tokenization
    "tiktoken>=0.9.0",
    "tokenizers>=0.21.0",
    "sentencepiece>=0.2.0",
    # Embeddings
    "sentence-transformers>=3.4.0",
    "openai>=1.59.0",
    "cohere>=5.1.0",
    # Vector Databases - Cloud
    "chromadb>=0.6.0",
    "qdrant-client>=1.13.0",
    "weaviate-client>=5.0.0",
    "pymilvus>=2.5.0",
    "pinecone>=5.1.0",  # formerly pinecone-client
    # Vector Databases - Self-hosted
    "faiss-cpu>=1.10.0",
    "redis>=5.3.0",
    "elasticsearch>=8.17.0",
    "pymongo>=4.11.0",
    # PostgreSQL with vector support
    "psycopg2-binary>=2.9.11",
    "pgvector>=0.4.0",
    # Data Science
    "numpy>=2.2.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.0",
    "sympy>=1.14.0",
    "networkx>=3.5.0",
    # Gradient Boosting
    "xgboost>=2.2.0",
    "lightgbm>=4.6.0",
    # Imbalanced Data
    "imbalanced-learn>=0.13.0",
    # Model Interpretability
    "shap>=0.47.0",
    "lime>=0.2.0",
    # Visualization
    "matplotlib>=3.11.0",
    "seaborn>=0.14.0",
    "plotly>=5.25.0",
    "wordcloud>=1.9.0",
    # Jupyter
    "jupyter>=1.1.0",
    "jupyterlab>=4.4.0",
    "ipykernel>=6.30.0",
    "ipywidgets>=8.2.0",
    "nbconvert>=7.17.0",
    "nbformat>=5.11.0",
    # RAG and LLM Frameworks
    "langchain>=0.4.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.4.0",
    "langchain-anthropic>=0.4.0",
    "langchain-core>=0.4.0",
    "langchain-experimental>=0.4.0",
    "langchain-ollama>=0.4.0",
    "llama-index>=0.13.0",
    "anthropic>=0.41.0",
    # RAG Extended Tools
    # ragatouille: Available for Python <=3.12; for 3.13+, check for updated wheels
    "rank-bm25>=0.2.2",
    "pypdf>=5.2.0",
    "pymupdf>=1.25.0",
    "pdf2image>=1.17.0",
    "colpali-engine>=0.4.0",
    "graphrag>=1.1.0",
    # AI Agents
    "langgraph>=0.3.0",
    "langgraph-supervisor>=0.0.2",
    "openai-agents>=0.1.1",
    "crewai>=0.81.0",
    "pyautogen>=0.4.1",
    "mcp>=1.1.0",
    "fastmcp>=0.2.0",
    "langmem>=0.0.7",
    "mini-swe-agent>=2.3.0",
    # Fine-tuning
    "peft>=0.14.0",
    "accelerate>=1.3.0",
    "trl>=0.13.0",
    "safetensors>=0.5.0",
    "evaluate>=0.4.1",
    "bert-score>=0.3.0",
    # unsloth: install separately in a Linux/CUDA env with a matching torch/CUDA stack.
    # autoawq: CUDA-only quantization, fails to build on macOS (requires torch at build time).
    # Install on Linux/CUDA: pip install autoawq
    # Local LLMs
    "ollama>=0.5.0",
    "litellm>=1.51.0",
    "llama-cpp-python>=0.4.0",
    # vllm: Linux-only, no macOS wheels available
    # "vllm>=0.7.0",
    # Multimodal
    "diffusers>=0.33.0",
    "pillow>=11.1.0",
    "opencv-python>=4.11.0",
    "timm>=1.1.0",
    "controlnet-aux>=0.0.10",
    # Multimodal - Audio
    "openai-whisper>=20240930",
    "faster-whisper>=1.1.0",
    # TTS (Coqui) requires pandas<2.0 which conflicts with pandas>=2.3.0 here.
    # Install separately when needed: pip install TTS==0.22.0 "pandas>=1.4,<2.0"
    "gtts>=2.6.0",
    "pydub>=0.25.0",
    # NLP Tools
    "spacy>=3.9.0",
    "nltk>=3.9.0",
    # gensim: Check compatibility with Python 3.13 before installing
    "seqeval>=1.3.0",
    "sacrebleu>=2.5.0",
    "rouge-score>=0.1.2",
    "detoxify>=0.5.1",
    # Fairness & Safety
    "fairlearn>=0.12.0",
    "presidio-analyzer>=2.3.0",
    "presidio-anonymizer>=2.3.0",
    "faker>=31.0.0",
    # AutoML & Optimization
    "flaml>=2.4.0",
    # pycaret requires matplotlib<3.8 and older deps - incompatible with this stack.
    # Install in a separate env: pip install pycaret==3.3.2
    "optuna>=4.2.0",
    # Low-code UI
    "gradio>=5.1.0",
    "streamlit>=1.41.0",
    # Time Series
    "prophet>=1.2.0",
    "pmdarima>=2.1.0",
    # Graph Neural Networks
    "torch-geometric>=2.7.0",
    # Reinforcement Learning
    "gymnasium>=1.1.0",
    # Cloud Platforms
    "google-cloud-aiplatform>=1.74.0",
    "azure-search-documents>=11.7.0",
    "azure-identity>=1.20.0",
    "opensearch-py>=2.8.0",
    "azureml-core>=1.57.0",
    # MLOps
    "fastapi>=0.116.0",
    "uvicorn>=0.33.0",
    "pydantic>=2.11.0",
    "mlflow>=2.18.0",
    "wandb>=0.19.0",
    "prometheus-client>=0.22.0",
    "psutil>=6.2.0",
    "joblib>=1.4.1",
    "evidently>=0.5.0",
    # Data Engineering
    "pyspark>=3.6.0",
    "kafka-python>=2.1.0",
    "prefect>=3.2.0",
    "feast>=0.41.0",
    "duckdb>=1.2.0",
    # Statistical Analysis
    "statsmodels>=0.15.0",
    "lifelines>=0.31.0",
    "pymc>=5.11.0",
    "arviz>=0.20.0",
    # Web / HTTP
    "httpx>=0.28.0",
    "websockets>=14.0.0",
    "sse-starlette>=2.1.0",
    # Task scheduling (used by agent notebooks)
    "schedule>=1.3.0",
    # Utilities
    "python-dotenv>=1.1.0",
    "tqdm>=4.68.0",
    "requests>=2.33.0",
    "huggingface-hub>=0.28.0",
    "click>=8.2.0",
    "pyyaml>=6.1.0",
    "tabulate>=0.9.1",
    "scikit-image>=0.25.0",
    "pandas-datareader>=0.11.0",
    # AWS
    "boto3>=1.36.0",
    "awscli>=1.36.0",
]

[project.optional-dependencies]
# GPU support (NVIDIA CUDA) - Linux/Windows only
gpu = [
    "bitsandbytes>=0.45.0; sys_platform != 'darwin'",
]

# Development tools
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.12.0",
    "flake8>=7.1.0",
    "mypy>=1.14.0",
]

# All optional dependencies
all = [
    "bitsandbytes>=0.45.0; sys_platform != 'darwin'",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.12.0",
    "flake8>=7.1.0",
    "mypy>=1.14.0",
]

# OpenHands is intentionally excluded from the shared project environment
# because it currently requires Python 3.12 and conflicts with feast's tenacity
# constraint. Install it from requirements-ai-dev-tools.txt in a dedicated tool env.

[project.urls]
Homepage = "https://zero-to-ai.dev"
Documentation = "https://zero-to-ai.dev"
Repository = "https://github.com/PavanMudigonda/zero-to-ai"
Issues = "https://github.com/PavanMudigonda/zero-to-ai/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This is a learning repository with notebooks, not a traditional package
py-modules = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.12.0",
    "flake8>=7.1.0",
    "mypy>=1.14.0",
]

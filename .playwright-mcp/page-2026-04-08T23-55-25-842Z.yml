            - generic [ref=e272]:
              - heading "Interview Preparation" [level=1] [ref=e273]
              - paragraph [ref=e274]: 15 core ML questions, coding problems, 3 system design walkthroughs, and LLM/GenAI questions. Use after building at least one project.
              - generic [ref=e275]:
                - 'heading "Part 1: Core ML Concepts (15 Questions)" [level=2] [ref=e276]'
                - generic [ref=e277]:
                  - 'heading "Q1: Bias-variance tradeoff?" [level=3] [ref=e278]'
                  - paragraph [ref=e279]: "Bias = underfitting (too simple). Variance = overfitting (too sensitive to training data). Goal: find the sweet spot. Diagnose: high train + val error = bias; low train, high val = variance."
                - generic [ref=e280]:
                  - 'heading "Q2: L1 vs L2 regularization?" [level=3] [ref=e281]'
                  - paragraph [ref=e282]:
                    - strong [ref=e283]: L1 (Lasso)
                    - text: ": Drives some weights to exactly zero. Good for feature selection."
                    - strong [ref=e284]: L2 (Ridge)
                    - text: ": Shrinks all weights toward zero. More stable with correlated features."
                    - strong [ref=e285]: Elastic Net
                    - text: ": Both combined."
                - generic [ref=e286]:
                  - 'heading "Q3: Gradient descent?" [level=3] [ref=e287]'
                  - paragraph [ref=e288]:
                    - text: Iteratively adjust parameters to minimize loss.
                    - code [ref=e289]: w = w - lr * gradient
                    - text: ". Variants: Batch (full dataset), SGD (one sample), Mini-batch (best of both), Adam (adaptive per-parameter, most common)."
                - generic [ref=e290]:
                  - 'heading "Q4: Class imbalance?" [level=3] [ref=e291]'
                  - list [ref=e292]:
                    - listitem [ref=e293]:
                      - paragraph [ref=e294]: Collect more minority data. 2. Use precision/recall/F1 instead of accuracy. 3. Resample (SMOTE / undersample). 4. Class weights. 5. If extreme (99.9%+), treat as anomaly detection.
                - generic [ref=e295]:
                  - 'heading "Q5: Precision, recall, F1?" [level=3] [ref=e296]'
                  - list [ref=e297]:
                    - listitem [ref=e298]:
                      - paragraph [ref=e299]:
                        - strong [ref=e300]: Precision
                        - text: ": TP / (TP + FP) — optimize when false positives are costly"
                    - listitem [ref=e301]:
                      - paragraph [ref=e302]:
                        - strong [ref=e303]: Recall
                        - text: ": TP / (TP + FN) — optimize when false negatives are costly"
                    - listitem [ref=e304]:
                      - paragraph [ref=e305]:
                        - strong [ref=e306]: F1
                        - text: ": Harmonic mean of both"
                - generic [ref=e307]:
                  - 'heading "Q6: Cross-validation?" [level=3] [ref=e308]'
                  - paragraph [ref=e309]: "Split data into K folds, train on K-1, validate on remaining, rotate K times. Use stratified K-fold for classification. Time series: use temporal splits. Never cross-validate on the test set."
                - generic [ref=e310]:
                  - 'heading "Q7: Transformer architecture?" [level=3] [ref=e311]'
                  - paragraph [ref=e312]:
                    - text: "Processes sequences in parallel via self-attention (not sequential like RNNs). Key components: token embeddings → positional encoding → multi-head self-attention → feed-forward → layer norm + residuals."
                    - code [ref=e313]: Attention(Q,K,V) = softmax(QK^T / sqrt(d_k)) V
                    - text: Encoder (BERT) = bidirectional. Decoder (GPT) = causal/masked.
                - generic [ref=e314]:
                  - 'heading "Q8: Overfitting prevention?" [level=3] [ref=e315]'
                  - paragraph [ref=e316]: More data, regularization (L1/L2/dropout), early stopping, data augmentation, simpler model, cross-validation, ensembles.
                - generic [ref=e317]:
                  - 'heading "Q9: Bagging vs boosting?" [level=3] [ref=e318]'
                  - paragraph [ref=e319]:
                    - strong [ref=e320]: Bagging
                    - text: "(Random Forest): parallel training on random subsets, reduces variance."
                    - strong [ref=e321]: Boosting
                    - text: "(XGBoost): sequential, each model corrects previous errors, reduces bias."
                - generic [ref=e322]:
                  - 'heading "Q10: Random Forest?" [level=3] [ref=e323]'
                  - paragraph [ref=e324]: Multiple decision trees on bootstrap samples with random feature subsets. Average predictions. Works because averaging decorrelated trees reduces variance without increasing bias.
                - generic [ref=e325]:
                  - 'heading "Q11: ROC curve and AUC?" [level=3] [ref=e326]'
                  - paragraph [ref=e327]: "ROC: TPR vs FPR at various thresholds. AUC: area under ROC (0.5 = random, >0.9 = outstanding). For imbalanced data, use precision-recall curves instead."
                - generic [ref=e328]:
                  - 'heading "Q12: Supervised vs unsupervised vs reinforcement?" [level=3] [ref=e329]'
                  - paragraph [ref=e330]:
                    - strong [ref=e331]: Supervised
                    - text: ": labeled data (classification, regression)."
                    - strong [ref=e332]: Unsupervised
                    - text: ": find patterns (clustering, PCA)."
                    - strong [ref=e333]: Reinforcement
                    - text: ": learn from rewards/penalties."
                    - strong [ref=e334]: Self-supervised
                    - text: ": create own labels (BERT masking, GPT next-token)."
                - generic [ref=e335]:
                  - 'heading "Q13: PCA?" [level=3] [ref=e336]'
                  - paragraph [ref=e337]: Finds directions of maximum variance, projects data onto them. Use for dimensionality reduction, visualization, noise reduction. Assumes linear relationships — use t-SNE/UMAP for non-linear.
                - generic [ref=e338]:
                  - 'heading "Q14: Backpropagation?" [level=3] [ref=e339]'
                  - paragraph [ref=e340]: Forward pass → compute loss → backward pass (chain rule to compute gradients) → update weights. Each layer needs only the gradient from above and its own local gradient.
                - generic [ref=e341]:
                  - 'heading "Q15: Loss functions?" [level=3] [ref=e342]'
                  - paragraph [ref=e343]:
                    - strong [ref=e344]: MSE
                    - text: ": regression, penalizes large errors."
                    - strong [ref=e345]: Cross-entropy
                    - text: ": classification, measures probability divergence."
                    - strong [ref=e346]: Binary cross-entropy
                    - text: ": binary classification. Others: Huber, hinge, focal, triplet, contrastive."
              - generic [ref=e347]:
                - 'heading "Part 2: Coding Problems" [level=2] [ref=e348]'
                - generic [ref=e349]:
                  - 'heading "Problem 1: Data Cleaning" [level=3] [ref=e350]'
                  - paragraph [ref=e351]: "Given a messy DataFrame: handle missing values, remove duplicates, compute stats, find correlations. (20 min)"
                - generic [ref=e352]:
                  - 'heading "Problem 2: Train a Classifier" [level=3] [ref=e353]'
                  - paragraph [ref=e354]: "Iris dataset: split, train 2+ models, cross-validate, compare metrics, select best. (20 min)"
                - generic [ref=e355]:
                  - 'heading "Problem 3: Simple RAG Pipeline" [level=3] [ref=e356]'
                  - paragraph [ref=e357]: Chunk docs → embed with SentenceTransformer → store in ChromaDB → retrieve → construct LLM prompt. (30 min)
                - generic [ref=e358]:
                  - 'heading "Problem 4: Feature Engineering" [level=3] [ref=e359]'
                  - paragraph [ref=e360]: Raw transactions → aggregated user features (count, sum, mean, max, std, unique categories, days active). (15 min)
              - generic [ref=e361]:
                - 'heading "Part 3: System Design Walkthroughs" [level=2] [ref=e362]'
                - generic [ref=e363]:
                  - 'heading "Design 1: RAG Document Q&A (10K+ PDFs)" [level=3] [ref=e364]'
                  - generic [ref=e366]:
                    - generic [ref=e367]: Ingestion → Chunk + Embed → Vector DB (Qdrant) → FastAPI → Retrieval + LLM → Streamlit
                    - button "Copy to clipboard" [ref=e368] [cursor=pointer]:
                      - img "Copy to clipboard" [ref=e369]
                  - paragraph [ref=e373]: "Key decisions: 512-token chunks with 50-token overlap. Hybrid search (dense + BM25) with reranking. GPT-4.1-mini or Claude Haiku 4.5 for cost. Redis caching. RAGAS evaluation."
                - generic [ref=e374]:
                  - 'heading "Design 2: Recommendation System (10M users, 1M products)" [level=3] [ref=e375]'
                  - paragraph [ref=e376]: "Two-stage: candidate generation (ANN via FAISS/Qdrant) → ranking (XGBoost on features). Real-time features from last 10 interactions. Cold start via content-based features. A/B test with 5% traffic. Latency budget: <100ms."
                - generic [ref=e377]:
                  - 'heading "Design 3: LLM Customer Support Agent" [level=3] [ref=e378]'
                  - paragraph [ref=e379]:
                    - text: "LangGraph orchestrator with tools:"
                    - code [ref=e380]: lookup_order
                    - text: ","
                    - code [ref=e381]: process_return
                    - text: ","
                    - code [ref=e382]: search_faq
                    - text: ","
                    - code [ref=e383]: escalate_to_human
                    - text: ". Guardrails: content moderation, PII redaction, rate limiting. GPT-4.1-mini for high volume, Claude Sonnet 4.6 for complex reasoning. Human-in-the-loop for high-stakes actions."
              - generic [ref=e384]:
                - 'heading "Part 4: LLM & GenAI Questions" [level=2] [ref=e385]'
                - paragraph [ref=e386]:
                  - strong [ref=e387]: "Q1: RAG vs fine-tuning vs prompting?"
                  - text: Try prompting → add RAG if hallucinations → fine-tune if style/format still wrong.
                - paragraph [ref=e388]:
                  - strong [ref=e389]: "Q2: RAG pipeline end-to-end?"
                  - text: Document → Chunk → Embed → Store → Query → Retrieve → Rerank → Augment prompt → Generate → Return with citations.
                - paragraph [ref=e390]:
                  - strong [ref=e391]: "Q3: What is LoRA?"
                  - text: "Freeze pre-trained weights, inject small trainable adapter matrices. Train ~2-5% of parameters. QLoRA: 4-bit base model + LoRA = 7B model on 4-6GB VRAM."
                - paragraph [ref=e392]:
                  - strong [ref=e393]: "Q4: How to evaluate RAG?"
                  - text: "RAGAS: faithfulness, answer relevancy, context precision, context recall. Also: latency, cost/query, user satisfaction."
                - paragraph [ref=e394]:
                  - strong [ref=e395]: "Q5: AI agents — what makes them reliable?"
                  - text: Structured outputs, explicit error handling per tool, retry with backoff, human-in-the-loop for high stakes, comprehensive logging, test scenarios.

        - paragraph [ref=e409]:
          - text: llama.cpp is the default engine and works on all platforms. vLLM requires NVIDIA GPUs and is supported on Linux x86_64 and Windows with WSL2. Diffusers enables image generation and requires NVIDIA GPUs on Linux (x86_64 or ARM64). See
          - link "Inference engines" [ref=e410] [cursor=pointer]:

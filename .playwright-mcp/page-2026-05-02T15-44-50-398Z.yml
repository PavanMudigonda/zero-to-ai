            - generic [ref=e321]: See Requirements section below
        - paragraph [ref=e322]:
          - text: Docker Model Runner (DMR) makes it easy to manage, run, and deploy AI models using Docker. Designed for developers, Docker Model Runner streamlines the process of pulling, running, and serving large language models (LLMs) and other AI models directly from Docker Hub, any OCI-compliant registry, or
          - link "Hugging Face" [ref=e323] [cursor=pointer]:
            - /url: https://huggingface.co/
          - text: .
        - paragraph [ref=e324]: With seamless integration into Docker Desktop and Docker Engine, you can serve models via OpenAI and Ollama-compatible APIs, package GGUF files as OCI Artifacts, and interact with models from both the command line and graphical interface.
        - paragraph [ref=e325]: Whether you're building generative AI applications, experimenting with machine learning workflows, or integrating AI into your software development lifecycle, Docker Model Runner provides a consistent, secure, and efficient way to work with AI models locally.
        - heading "Key features" [level=2] [ref=e326]:
          - link "Key features" [ref=e327] [cursor=pointer]:
            - /url: "#key-features"
        - list [ref=e328]:
          - listitem [ref=e329]:
            - link "Pull and push models to and from Docker Hub or any OCI-compliant registry" [ref=e330] [cursor=pointer]:
              - /url: https://hub.docker.com/u/ai
          - listitem [ref=e331]:
            - link "Pull models from Hugging Face" [ref=e332] [cursor=pointer]:
              - /url: https://huggingface.co/
          - listitem [ref=e333]:
            - text: Serve models on
            - link "OpenAI and Ollama-compatible APIs" [ref=e334] [cursor=pointer]:
              - /url: https://docs.docker.com/ai/model-runner/api-reference/
            - text: for easy integration with existing apps
          - listitem [ref=e335]:
            - text: Support for
            - link "llama.cpp, vLLM, and Diffusers inference engines" [ref=e336] [cursor=pointer]:
              - /url: https://docs.docker.com/ai/model-runner/inference-engines/
            - text: (vLLM and Diffusers on Linux with NVIDIA GPUs)
          - listitem [ref=e337]:
            - link "Generate images from text prompts" [ref=e338] [cursor=pointer]:
              - /url: https://docs.docker.com/ai/model-runner/inference-engines/#diffusers
            - text: using Stable Diffusion models with the Diffusers backend
          - listitem [ref=e339]: Package GGUF and Safetensors files as OCI Artifacts and publish them to any Container Registry
          - listitem [ref=e340]: Run and interact with AI models directly from the command line or from the Docker Desktop GUI
          - listitem [ref=e341]:
            - link "Connect to AI coding tools" [ref=e342] [cursor=pointer]:
              - /url: https://docs.docker.com/ai/model-runner/ide-integrations/
            - text: like Cline, Continue, Cursor, and Aider
          - listitem [ref=e343]:
            - link "Configure context size and model parameters" [ref=e344] [cursor=pointer]:
              - /url: https://docs.docker.com/ai/model-runner/configuration/
            - text: to tune performance
          - listitem [ref=e345]:
            - link "Set up Open WebUI" [ref=e346] [cursor=pointer]:
              - /url: https://docs.docker.com/ai/model-runner/openwebui-integration/
            - text: for a ChatGPT-like web interface
          - listitem [ref=e347]: Manage local models and display logs
          - listitem [ref=e348]: Display prompt and response details
          - listitem [ref=e349]: Conversational context support for multi-turn interactions

          - rowgroup [ref=e393]:
            - row "llama.cpp Local development, resource efficiency GGUF (quantized)" [ref=e394]:
              - cell "llama.cpp" [ref=e395]:
                - link "llama.cpp" [ref=e396] [cursor=pointer]:

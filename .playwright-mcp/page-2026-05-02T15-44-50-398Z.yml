        - heading "How Docker Model Runner works" [level=2] [ref=e378]:
          - link "How Docker Model Runner works" [ref=e379] [cursor=pointer]:
            - /url: "#how-docker-model-runner-works"
        - paragraph [ref=e380]:
          - text: Models are pulled from Docker Hub, an OCI-compliant registry, or
          - link "Hugging Face" [ref=e381] [cursor=pointer]:
            - /url: https://huggingface.co/
          - text: the first time you use them and are stored locally. They load into memory only at runtime when a request is made, and unload when not in use to optimize resources. Because models can be large, the initial pull may take some time. After that, they're cached locally for faster access. You can interact with the model using
          - link "OpenAI and Ollama-compatible APIs" [ref=e382] [cursor=pointer]:
            - /url: https://docs.docker.com/ai/model-runner/api-reference/
          - text: .
        - heading "Inference engines" [level=3] [ref=e383]:

                    - generic [ref=e577]: "# Install: pip install faiss-cpu (or faiss-gpu) import faiss import numpy as np # Create index dimension = 1536 index = faiss.IndexFlatL2(dimension) # L2 distance # index = faiss.IndexFlatIP(dimension) # Inner product (cosine) # Add vectors vectors = np.random.random((100, dimension)).astype('float32') index.add(vectors) # Search query_vector = np.random.random((1, dimension)).astype('float32') k = 5 # Top 5 results distances, indices = index.search(query_vector, k) print(f\"Top {k} results:\") for i, (idx, dist) in enumerate(zip(indices[0], distances[0])): print(f\" {i+1}. Index: {idx}, Distance: {dist:.4f}\")"

                - generic [ref=e533]:
                  - heading "1. Chroma (Local)" [level=3] [ref=e534]
                  - generic [ref=e536]:
                    - generic [ref=e537]: "# Install: pip install chromadb import chromadb from chromadb.config import Settings # Initialize (persistent storage) client = chromadb.Client(Settings( persist_directory=\"./chroma_db\", chroma_db_impl=\"duckdb+parquet\" )) # Create collection collection = client.create_collection( name=\"documents\", metadata={\"hnsw:space\": \"cosine\"} ) # Add documents (Chroma generates embeddings automatically) collection.add( documents=[ \"Machine learning is a subset of AI\", \"Deep learning uses neural networks\", \"Natural language processing handles text\" ], ids=[\"doc1\", \"doc2\", \"doc3\"], metadatas=[ {\"category\": \"ML\"}, {\"category\": \"DL\"}, {\"category\": \"NLP\"} ] ) # Query results = collection.query( query_texts=[\"What is deep learning?\"], n_results=3 ) print(results)"
                    - button "Copy to clipboard" [ref=e538] [cursor=pointer]:
                      - img "Copy to clipboard" [ref=e539]
                - generic [ref=e543]:
                  - heading "2. Qdrant (Self-Hosted or Cloud)" [level=3] [ref=e544]
                  - generic [ref=e546]:
                    - generic [ref=e547]: "# Install: pip install qdrant-client from qdrant_client import QdrantClient from qdrant_client.models import Distance, VectorParams, PointStruct, Filter, FieldCondition, MatchValue # Initialize client = QdrantClient(path=\"./qdrant_db\") # Local file-based # client = QdrantClient(url=\"http://localhost:6333\") # Docker # client = QdrantClient(url=\"https://xyz.cloud.qdrant.io\", api_key=\"your-key\") # Cloud # Create collection with advanced config client.create_collection( collection_name=\"documents\", vectors_config=VectorParams( size=1536, distance=Distance.COSINE, on_disk=False # Keep in memory for speed ) ) # Add vectors with rich metadata points = [ PointStruct( id=1, vector=[0.1] * 1536, payload={ \"text\": \"Machine learning is a subset of AI\", \"category\": \"ML\", \"date\": \"2024-01-15\", \"author\": \"John Doe\" } ), PointStruct( id=2, vector=[0.2] * 1536, payload={ \"text\": \"Deep learning uses neural networks\", \"category\": \"DL\", \"date\": \"2024-01-16\", \"author\": \"Jane Smith\" } ), PointStruct( id=3, vector=[0.15] * 1536, payload={ \"text\": \"Natural language processing handles text\", \"category\": \"NLP\", \"date\": \"2024-01-17\", \"author\": \"John Doe\" } ) ] client.upsert(collection_name=\"documents\", points=points) # Basic search search_result = client.search( collection_name=\"documents\", query_vector=[0.1] * 1536, limit=3 ) for hit in search_result: print(f\"Score: {hit.score:.4f} - {hit.payload['text']}\") # Advanced search with filtering filtered_result = client.search( collection_name=\"documents\", query_vector=[0.1] * 1536, query_filter=Filter( must=[ FieldCondition( key=\"category\", match=MatchValue(value=\"ML\") ) ] ), limit=3 ) # Batch search (multiple queries at once) batch_results = client.search_batch( collection_name=\"documents\", requests=[ { \"vector\": [0.1] * 1536, \"limit\": 2 }, { \"vector\": [0.2] * 1536, \"limit\": 2 } ] ) # Scroll through all points (for export/backup) records, next_offset = client.scroll( collection_name=\"documents\", limit=10 ) # Get collection info collection_info = client.get_collection(\"documents\") print(f\"Vectors count: {collection_info.vectors_count}\") print(f\"Points count: {collection_info.points_count}\") # Delete by filter client.delete( collection_name=\"documents\", points_selector=Filter( must=[ FieldCondition(key=\"author\", match=MatchValue(value=\"John Doe\")) ] ) )"
                    - button "Copy to clipboard" [ref=e548] [cursor=pointer]:
                      - img "Copy to clipboard" [ref=e549]
                - generic [ref=e553]:
                  - heading "3. Weaviate (Self-Hosted )" [level=3] [ref=e554]
                  - generic [ref=e556]:
                    - generic [ref=e557]: "# Install: pip install weaviate-client import weaviate from weaviate.classes.init import Auth from weaviate.classes.query import MetadataQuery # Initialize client = weaviate.connect_to_local() # Docker local # client = weaviate.connect_to_wcs( # cluster_url=\"https://your-cluster.weaviate.network\", # auth_credentials=Auth.api_key(\"your-api-key\") # ) # Weaviate Cloud # Create collection (schema) from weaviate.classes.config import Configure, Property, DataType collection = client.collections.create( name=\"Document\", description=\"A collection of documents with embeddings\", vectorizer_config=Configure.Vectorizer.none(), # We provide our own vectors properties=[ Property(name=\"text\", data_type=DataType.TEXT), Property(name=\"category\", data_type=DataType.TEXT), Property(name=\"date\", data_type=DataType.DATE), Property(name=\"author\", data_type=DataType.TEXT) ] ) # Add objects with vectors documents = client.collections.get(\"Document\") documents.data.insert_many([ { \"text\": \"Machine learning is a subset of AI\", \"category\": \"ML\", \"date\": \"2024-01-15T00:00:00Z\", \"author\": \"John Doe\", \"_vector\": [0.1] * 1536 }, { \"text\": \"Deep learning uses neural networks\", \"category\": \"DL\", \"date\": \"2024-01-16T00:00:00Z\", \"author\": \"Jane Smith\", \"_vector\": [0.2] * 1536 }, { \"text\": \"Natural language processing handles text\", \"category\": \"NLP\", \"date\": \"2024-01-17T00:00:00Z\", \"author\": \"John Doe\", \"_vector\": [0.15] * 1536 } ]) # Vector search response = documents.query.near_vector( near_vector=[0.1] * 1536, limit=3, return_metadata=MetadataQuery(distance=True) ) for obj in response.objects: print(f\"Distance: {obj.metadata.distance:.4f}\") print(f\"Text: {obj.properties['text']}\") print(f\"Category: {obj.properties['category']}\\n\") # Filtered vector search from weaviate.classes.query import Filter response = documents.query.near_vector( near_vector=[0.1] * 1536, limit=3, filters=Filter.by_property(\"category\").equal(\"ML\") ) # Hybrid search (vector + keyword) response = documents.query.hybrid( query=\"machine learning artificial intelligence\", vector=[0.1] * 1536, alpha=0.5, # 0.5 = balanced, 0 = pure keyword, 1 = pure vector limit=3 ) # GraphQL query (Weaviate's native interface) # This gives you more flexibility result = client.query.get( \"Document\", [\"text\", \"category\", \"author\"] ).with_near_vector({ \"vector\": [0.1] * 1536 }).with_limit(3).with_additional([\"distance\", \"certainty\"]).do() print(result) # Aggregate queries response = documents.aggregate.over_all( group_by=\"category\" ) # Get object by ID uuid = response.objects[0].uuid obj = documents.query.fetch_object_by_id(uuid) # Update object documents.data.update( uuid=uuid, properties={\"text\": \"Updated text about machine learning\"} ) # Delete objects documents.data.delete_by_id(uuid) # Batch operations for performance with client.batch.dynamic() as batch: for i in range(1000): batch.add_object( collection=\"Document\", properties={ \"text\": f\"Document {i}\", \"category\": \"Batch\", \"date\": \"2024-01-01T00:00:00Z\", \"author\": \"Batch User\" }, vector=[0.1] * 1536 ) client.close()"
                    - button "Copy to clipboard" [ref=e558] [cursor=pointer]:
                      - img "Copy to clipboard" [ref=e559]
                - generic [ref=e563]:
                  - heading "4. Milvus (Self-Hosted or Zilliz Cloud)" [level=3] [ref=e564]
                  - generic [ref=e566]:
                    - generic [ref=e567]: "# Install: pip install pymilvus from pymilvus import ( connections, utility, FieldSchema, CollectionSchema, DataType, Collection ) # Connect to Milvus connections.connect( alias=\"default\", host='localhost', port='19530' ) # Zilliz Cloud: # connections.connect( # alias=\"default\", # uri=\"https://your-cluster.zillizcloud.com\", # token=\"your-token\" # ) # Check if collection exists collection_name = \"documents\" if utility.has_collection(collection_name): utility.drop_collection(collection_name) # Define schema fields = [ FieldSchema(name=\"id\", dtype=DataType.INT64, is_primary=True, auto_id=True), FieldSchema(name=\"text\", dtype=DataType.VARCHAR, max_length=1000), FieldSchema(name=\"category\", dtype=DataType.VARCHAR, max_length=100), FieldSchema(name=\"author\", dtype=DataType.VARCHAR, max_length=200), FieldSchema(name=\"embedding\", dtype=DataType.FLOAT_VECTOR, dim=1536) ] schema = CollectionSchema( fields=fields, description=\"Document collection with embeddings\", enable_dynamic_field=True # Allow dynamic fields ) # Create collection collection = Collection( name=collection_name, schema=schema, using='default', shards_num=2 # Number of shards for distribution ) # Insert data entities = [ [\"Machine learning is a subset of AI\", \"Deep learning uses neural networks\", \"NLP handles text\"], [\"ML\", \"DL\", \"NLP\"], [\"John Doe\", \"Jane Smith\", \"John Doe\"], [[0.1] * 1536, [0.2] * 1536, [0.15] * 1536] ] insert_result = collection.insert(entities) print(f\"Inserted {len(insert_result.primary_keys)} entities\") # Create index for fast search (required before searching) index_params = { \"metric_type\": \"COSINE\", # or \"L2\", \"IP\" (inner product) \"index_type\": \"IVF_FLAT\", # or \"HNSW\", \"IVF_SQ8\", etc. \"params\": {\"nlist\": 128} } collection.create_index( field_name=\"embedding\", index_params=index_params ) # Load collection into memory (required before search) collection.load() # Vector search search_params = { \"metric_type\": \"COSINE\", \"params\": {\"nprobe\": 10} } query_vector = [[0.1] * 1536] results = collection.search( data=query_vector, anns_field=\"embedding\", param=search_params, limit=3, output_fields=[\"text\", \"category\", \"author\"] ) for hits in results: for hit in hits: print(f\"Distance: {hit.distance:.4f}\") print(f\"Text: {hit.entity.get('text')}\") print(f\"Category: {hit.entity.get('category')}\\n\") # Filtered search (boolean expression) results = collection.search( data=query_vector, anns_field=\"embedding\", param=search_params, limit=3, expr='category == \"ML\"', # Filter expression output_fields=[\"text\", \"category\", \"author\"] ) # Hybrid search (with scalar filtering) results = collection.search( data=query_vector, anns_field=\"embedding\", param=search_params, limit=3, expr='author == \"John Doe\" and category in [\"ML\", \"NLP\"]', output_fields=[\"text\", \"category\", \"author\"] ) # Query by ID query_result = collection.query( expr=\"id in [1, 2, 3]\", output_fields=[\"id\", \"text\", \"category\"] ) # Delete entities collection.delete(expr='category == \"DL\"') # Get collection statistics stats = collection.get_stats() print(f\"Collection stats: {stats}\") # Partition support (for multi-tenancy) partition = collection.create_partition(\"partition_2024\") partition.insert(entities) # Search in specific partition results = collection.search( data=query_vector, anns_field=\"embedding\", param=search_params, limit=3, partition_names=[\"partition_2024\"] ) # Release collection from memory collection.release() # Drop collection utility.drop_collection(collection_name) # Disconnect connections.disconnect(\"default\")"
                    - button "Copy to clipboard" [ref=e568] [cursor=pointer]:
                      - img "Copy to clipboard" [ref=e569]

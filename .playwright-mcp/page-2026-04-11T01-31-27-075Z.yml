                      - strong [ref=e328]: Estimate costs accurately
                      - text: ": APIs charge per token, not per word"
                  - listitem [ref=e329]:
                    - paragraph [ref=e330]:
                      - strong [ref=e331]: Debug model behavior
                      - text: ": Some languages tokenize less efficiently than English"
                  - listitem [ref=e332]:

              - generic [ref=e319]:
                - heading "Why Tokenization Matters" [level=2] [ref=e320]
                - paragraph [ref=e321]: "Every LLM interaction starts with tokenization. When you send a prompt to GPT-4 or Claude, it is first split into tokens — sub-word units that the model actually processes. Understanding tokenization helps you:"
                - list [ref=e322]:

          - generic [ref=e296]: Docker Build Cloud
        - generic [ref=e297]:
          - heading "Docker Build Cloud" [level=1] [ref=e298]
          - generic [ref=e301]:
            - button "Copy as Markdown" [ref=e302] [cursor=pointer]:
              - img [ref=e304]
              - generic [ref=e306]: Copy as Markdown
            - button "More options" [ref=e307]:
              - img [ref=e308]
        - generic [ref=e311]:
          - generic [ref=e312]: "Subscription:"
          - generic [ref=e313]: Pro
          - img [ref=e315]
          - generic [ref=e317]: Team
          - img [ref=e319]
          - generic [ref=e321]: Business
          - img [ref=e323]
        - paragraph [ref=e325]: Docker Build Cloud is a service that lets you build your container images faster, both locally and in CI. Builds run on cloud infrastructure optimally dimensioned for your workloads, no configuration required. The service uses a remote build cache, ensuring fast builds anywhere and for all team members.
        - heading "How Docker Build Cloud works" [level=2] [ref=e326]:
          - link "How Docker Build Cloud works" [ref=e327] [cursor=pointer]:
            - /url: "#how-docker-build-cloud-works"
        - paragraph [ref=e328]:
          - text: Using Docker Build Cloud is no different from running a regular build. You invoke a build the same way you normally would, using
          - code [ref=e329]: docker buildx build
          - text: . The difference is in where and how that build gets executed.
        - paragraph [ref=e330]: By default when you invoke a build command, the build runs on a local instance of BuildKit, bundled with the Docker daemon. With Docker Build Cloud, you send the build request to a BuildKit instance running remotely, in the cloud. All data is encrypted in transit.
        - paragraph [ref=e331]: The remote builder executes the build steps, and sends the resulting build output to the destination that you specify. For example, back to your local Docker Engine image store, or to an image registry.
        - paragraph [ref=e332]: "Docker Build Cloud provides several benefits over local builds:"
        - list [ref=e333]:
          - listitem [ref=e334]: Improved build speed
          - listitem [ref=e335]: Shared build cache
          - listitem [ref=e336]: Native multi-platform builds
        - paragraph [ref=e337]: "And the best part: you don't need to worry about managing builders or infrastructure. Just connect to your builders, and start building. Each cloud builder provisioned to an organization is completely isolated to a single Amazon EC2 instance, with a dedicated EBS volume for build cache, and encryption in transit. That means there are no shared processes or data between cloud builders."
        - blockquote [ref=e338]:
          - generic [ref=e339]:
            - img [ref=e341]
            - generic [ref=e343]: Note
          - paragraph [ref=e345]: Docker Build Cloud is only available in the US East region.
        - heading "Get Docker Build Cloud" [level=2] [ref=e346]:
          - link "Get Docker Build Cloud" [ref=e347] [cursor=pointer]:
            - /url: "#get-docker-build-cloud"
        - paragraph [ref=e348]:
          - text: To get started with Docker Build Cloud,
          - link "create a Docker account" [ref=e349] [cursor=pointer]:
            - /url: /accounts/create-account/
          - text: ". There are two options to get access to Docker Build Cloud:"
        - list [ref=e350]:
          - listitem [ref=e351]:
            - text: Users with a free Personal account can opt-in to a 7-day free trial, with the option to subscribe for access. To start your free trial, sign in to
            - link "Docker Build Cloud Dashboard" [ref=e352] [cursor=pointer]:
              - /url: https://app.docker.com/build/
            - text: and follow the on-screen instructions.
          - listitem [ref=e353]:
            - text: All users with a paid Docker subscription have access to Docker Build Cloud included with their Docker suite of products. See
            - link "Docker subscriptions and features" [ref=e354] [cursor=pointer]:
              - /url: https://www.docker.com/pricing?ref=Docs&refAction=DocsBuildCloud
            - text: for more information.
        - paragraph [ref=e355]:
          - text: Once you've signed up and created a builder, continue by
          - link "setting up the builder in your local environment" [ref=e356] [cursor=pointer]:
            - /url: https://docs.docker.com/build-cloud/setup/
          - text: .
        - paragraph [ref=e357]:
          - text: For information about roles and permissions related to Docker Build Cloud, see
          - link "Roles and Permissions" [ref=e358] [cursor=pointer]:
            - /url: https://docs.docker.com/enterprise/security/roles-and-permissions/#docker-build-cloud-permissions
          - text: .

                    - generic [ref=e382]: "# The fundamental RAG flow: # 1. Index documents → embeddings → vector DB # 2. User query → embedding → similarity search # 3. Retrieved docs + query → LLM → answer from sentence_transformers import SentenceTransformer from your_vector_db import VectorDB # Chroma, Qdrant, etc. from openai import OpenAI # 1. Index your documents # Use any embedding model - see 05-embeddings/embedding_comparison.md for options # API: Gemini Embedding (cheapest + best), Voyage 3.5, or OpenAI # Local: Qwen3-Embedding, BGE-M3, or all-MiniLM-L6-v2 model = SentenceTransformer('all-MiniLM-L6-v2') # local, fast docs = [\"Your documents here...\"] embeddings = model.encode(docs) db.add(documents=docs, embeddings=embeddings) # 2. Retrieve relevant context query = \"What is RAG?\" query_embedding = model.encode(query) results = db.search(query_embedding, top_k=3) # 3. Generate answer with LLM (Claude, GPT, Gemini, or local) context = \"\\n\".join(results) prompt = f\"Context: {context}\\n\\nQuestion: {query}\\n\\nAnswer:\" response = llm.generate(prompt)"

                  - paragraph [ref=e1175]:
                    - strong [ref=e1176]: "Quick environment checks (copy and paste):"
                  - generic [ref=e1178]:
                    - generic [ref=e1179]: "# Check Python version and location python --version && which python # Verify key packages in one line python -c \"import sys; import numpy as np; import pandas as pd; import sklearn; import torch; print(f'✅ Python {sys.version_info.major}.{sys.version_info.minor} | NumPy {np.__version__} | Pandas {pd.__version__} | PyTorch {torch.__version__} | CUDA: {torch.cuda.is_available()}')\" # Check CUDA setup python -c \"import torch; print(f'CUDA Available: {torch.cuda.is_available()}'); print(f'CUDA Version: {torch.version.cuda}' if torch.cuda.is_available() else 'CPU Only'); print(f'GPU: {torch.cuda.get_device_name(0)}' if torch.cuda.is_available() else 'No GPU')\" # List installed packages pip list | grep -E 'numpy|pandas|torch|transformers|jupyter'"
                    - button "Copy to clipboard" [ref=e1180] [cursor=pointer]:
                      - img "Copy to clipboard" [ref=e1181]
                - generic [ref=e1185]:
                  - heading "📝 Comprehensive Diagnostic Script" [level=3] [ref=e1186]
                  - paragraph [ref=e1187]: "Run this complete diagnostic to check your environment:"
                  - generic [ref=e1189]:
                    - generic [ref=e1190]: "#!/usr/bin/env python3 \"\"\"Comprehensive environment diagnostic script for Zero to AI\"\"\" import sys import platform import subprocess print(\"=\" * 60) print(\"ZERO TO AI - ENVIRONMENT DIAGNOSTICS\") print(\"=\" * 60) # System Information print(\"\\n📋 SYSTEM INFORMATION\") print(\"-\" * 60) print(f\"Platform: {platform.platform()}\") print(f\"Python Version: {sys.version}\") print(f\"Python Executable: {sys.executable}\") print(f\"Architecture: {platform.machine()}\") # Check Python version compatibility python_version = sys.version_info if python_version >= (3, 9): print(f\"✅ Python version {python_version.major}.{python_version.minor} is compatible\") else: print(f\"❌ Python {python_version.major}.{python_version.minor} detected. Please upgrade to 3.9+\") # Package Checks print(\"\\n📦 CHECKING PACKAGES\") print(\"-\" * 60) packages = [ 'numpy', 'pandas', 'matplotlib', 'scikit-learn', 'torch', 'torchvision', 'transformers', 'tokenizers', 'jupyter', 'notebook', 'ipykernel' ] missing_packages = [] for package in packages: try: mod = __import__(package.replace('-', '_')) version = getattr(mod, '__version__', 'Unknown') print(f\"✅ {package:20s} {version}\") except ImportError: print(f\"❌ {package:20s} NOT INSTALLED\") missing_packages.append(package) # GPU/CUDA Check print(\"\\n🎮 GPU/CUDA STATUS\") print(\"-\" * 60) try: import torch cuda_available = torch.cuda.is_available() print(f\"CUDA Available: {'✅ YES' if cuda_available else '❌ NO'}\") if cuda_available: print(f\"CUDA Version: {torch.version.cuda}\") print(f\"GPU Device: {torch.cuda.get_device_name(0)}\") print(f\"GPU Memory: {torch.cuda.get_device_properties(0).total_memory / 1024**3:.2f} GB\") else: print(\"Running in CPU-only mode\") print(\"For GPU support, install PyTorch with CUDA:\") print(\" pip install torch --index-url https://download.pytorch.org/whl/cu118\") # Check MPS (Apple Silicon) if hasattr(torch.backends, 'mps') and torch.backends.mps.is_available(): print(\"✅ Apple Metal Performance Shaders (MPS) available\") except ImportError: print(\"❌ PyTorch not installed - cannot check CUDA status\") # Memory Check print(\"\\n💾 SYSTEM RESOURCES\") print(\"-\" * 60) try: import psutil mem = psutil.virtual_memory() print(f\"Total RAM: {mem.total / 1024**3:.2f} GB\") print(f\"Available RAM: {mem.available / 1024**3:.2f} GB\") print(f\"RAM Usage: {mem.percent}%\") except ImportError: print(\"⚠️ psutil not installed - cannot check memory\") # Jupyter Check print(\"\\n📓 JUPYTER STATUS\") print(\"-\" * 60) try: result = subprocess.run(['jupyter', '--version'], capture_output=True, text=True) if result.returncode == 0: print(\"✅ Jupyter installed:\") print(result.stdout) else: print(\"❌ Jupyter command failed\") except FileNotFoundError: print(\"❌ Jupyter not found in PATH\") # Summary print(\"\\n\" + \"=\" * 60) print(\"SUMMARY\") print(\"=\" * 60) if missing_packages: print(f\"\\n❌ Missing packages ({len(missing_packages)}):\") print(\" \" + \", \".join(missing_packages)) print(\"\\n📝 To install missing packages:\") print(f\" pip install {' '.join(missing_packages)}\") else: print(\"\\n✅ All core packages installed!\") if python_version < (3, 9): print(\"\\n⚠️ WARNING: Python version upgrade required (3.9+)\") print(\"\\n💡 For detailed troubleshooting, visit:\") print(\" https://github.com/PavanMudigonda/zero-to-ai/blob/main/00-course-setup/troubleshooting.md\") print(\"\\n\" + \"=\" * 60)"

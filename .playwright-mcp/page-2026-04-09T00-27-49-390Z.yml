ment.body.classList.add(\"sidebar-right-collapsed\"); setRightWidth(0); } else { document.body.classList.remove(\"sidebar-right-collapsed\"); setRightWidth(newW); } } function onUp() { document.removeEventListener(\"mousemove\", onMove); document.removeEventListener(\"mouseup\", onUp); document.body.classList.remove(\"sidebar-resizing\"); var finalW = rightDrawer.getBoundingClientRect().width; if (finalW < SNAP_THRESHOLD) { collapseRight(); } else { localStorage.setItem(RIGHT_COL_KEY, \"0\"); localStorage.setItem(RIGHT_W_KEY, Math.round(finalW)); lastRightW = Math.round(finalW); } removeStoredStyle(); } document.addEventListener(\"mousemove\", onMove); document.addEventListener(\"mouseup\", onUp); }); rh.addEventListener(\"mousedown\", function (e) { e.preventDefault(); document.body.classList.add(\"sidebar-resizing\"); var startX = e.clientX; var startW = rightDrawer.getBoundingClientRect().width; var wasCollapsed = document.body.classList.contains(\"sidebar-right-collapsed\"); if (wasCollapsed) { expandRight(0); startW = 0; } function onMove(ev) { var newW = Math.max(0, startW - (ev.clientX - startX)); if (newW < SNAP_THRESHOLD) { document.body.classList.add(\"sidebar-right-collapsed\"); setRightWidth(0); } else { document.body.classList.remove(\"sidebar-right-collapsed\"); setRightWidth(newW); } } function onUp(ev) { document.removeEventListener(\"mousemove\", onMove); document.removeEventListener(\"mouseup\", onUp); document.body.classList.remove(\"sidebar-resizing\"); var finalW = rightDrawer.getBoundingClientRect().width; if (finalW < SNAP_THRESHOLD) { collapseRight(); lastRightW = startW > MIN_W ? startW : emToPx(DEFAULT_RIGHT); } else { localStorage.setItem(RIGHT_COL_KEY, \"0\"); localStorage.setItem(RIGHT_W_KEY, Math.round(finalW)); lastRightW = Math.round(finalW); } removeStoredStyle(); } document.addEventListener(\"mousemove\", onMove); document.addEventListener(\"mouseup\", onUp); }); rh.addEventListener(\"dblclick\", function () { if (document.body.clas
                  - paragraph [ref=e1361]: "Aider excels at systematic, git-tracked refactoring:"
                  - generic [ref=e1363]:
                    - generic [ref=e1364]: "# Add experiment tracking to a training script aider --message \\ \"Add WandB experiment tracking to train.py: - wandb.init() at the start with project='my-project' - Log train/val loss and accuracy every epoch - Log model architecture summary - Save best model checkpoint with wandb.save() - wandb.finish() at the end\" \\ src/train.py \\ --model claude-opus-4-6 \\ --yes # Convert training script to use Hydra config aider --message \\ \"Convert hardcoded hyperparameters to Hydra configuration: - Create conf/config.yaml with all current hyperparams - Add @hydra.main decorator to main() - Replace all hardcoded values with cfg.field references\" \\ src/train.py conf/ \\ --model claude-opus-4-6 \\ --yes # Add type hints to entire src directory find src/ -name \"*.py\" | while read f; do aider --message \"Add complete type hints to all functions. Import from typing as needed.\" \\ \"$f\" --model claude-sonnet-4-6 --yes done"

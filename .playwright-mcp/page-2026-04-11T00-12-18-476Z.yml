              - generic [ref=e404]:
                - heading "1. Cursor AI" [level=2] [ref=e405]
                - paragraph [ref=e406]:
                  - strong [ref=e407]: What it is
                  - text: ": A fork of VS Code built around AI as a first-class feature, not a plugin. Cursor replaces the entire editor experience — everything from autocomplete to multi-file editing is AI-native."
                - paragraph [ref=e408]:
                  - strong [ref=e409]: Valuation
                  - text: ": $9B (Series B, 2025). One of the fastest-growing developer tools companies ever."
                - paragraph [ref=e410]:

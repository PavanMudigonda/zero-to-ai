                  - generic [ref=e1339]:
                    - generic [ref=e1340]: "## ML Project Rules - All experiments must log to WandB with wandb.init() - Use hydra @hydra.main() for all training scripts - DataLoader workers: use cpu_count() // 2 - Always seed: torch.manual_seed, numpy.random.seed, random.seed - Model checkpoints go in checkpoints/{run_name}/ - Never hardcode learning rates or batch sizes - use config - Evaluation always uses torch.no_grad() context manager - For HuggingFace models, always specify trust_remote_code=False"

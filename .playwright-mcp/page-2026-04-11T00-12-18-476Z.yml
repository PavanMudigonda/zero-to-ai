                - generic [ref=e413]:
                  - heading "Key Features" [level=3] [ref=e414]
                  - generic [ref=e415]:
                    - heading "Composer (Multi-File Editing)" [level=4] [ref=e416]
                    - paragraph [ref=e417]: Cursor’s flagship feature. Describe a change in natural language and Composer edits multiple files simultaneously with a diff view you can accept, reject, or edit. This is the key differentiator from GitHub Copilot’s single-file approach.
                    - generic [ref=e419]:
                      - generic [ref=e420]: "Example Composer prompts: - \"Add input validation to all API endpoints in src/routes/\" - \"Refactor the DataLoader class to support async loading\" - \"Add type hints to all functions in training/trainer.py\""
                      - button "Copy to clipboard" [ref=e421] [cursor=pointer]:
                        - img "Copy to clipboard" [ref=e422]
                  - generic [ref=e426]:
                    - heading "Tab Autocomplete" [level=4] [ref=e427]
                    - paragraph [ref=e428]: Context-aware autocomplete that understands your entire codebase, not just the current file. Learns your patterns and coding style. Significantly more accurate than GitHub Copilot for large codebases because of the full codebase indexing.
                  - generic [ref=e429]:
                    - heading "Bug Finder" [level=4] [ref=e430]
                    - paragraph [ref=e431]:
                      - text: Run
                      - code [ref=e432]: Ctrl+Shift+P → Find bugs
                      - text: to get a structured analysis of potential issues in the current file or selection. Identifies logical errors, edge cases, and security vulnerabilities.

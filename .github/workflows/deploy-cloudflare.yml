name: Deploy Sphinx to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            TAG="v0.1.0"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "lts/*"

      - name: Install Wrangler CLI
        run: npm install --global wrangler@4

      - name: Generate Sphinx site
        run: |
          bash scripts/build_site.sh
          sphinx-build -b html -D release="${SITE_VERSION}" docs site
        env:
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
          SITE_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload generated site artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sphinx-site
          path: site
          if-no-files-found: error

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy site --project-name=zero-to-ai --branch="${GITHUB_REF_NAME}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

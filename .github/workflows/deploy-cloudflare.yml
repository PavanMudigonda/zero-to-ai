name: Deploy Next.js to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
                    
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: 'next-docs/package-lock.json'

      - name: Install dependencies
        working-directory: ./next-docs
        run: npm ci

      - name: Allocate swap space
        run: |
          sudo fallocate -l 16G /swapfile-new
          sudo chmod 600 /swapfile-new
          sudo mkswap /swapfile-new
          sudo swapon /swapfile-new

      - name: Build Next.js site
        working-directory: ./next-docs
        run: |
          rm -rf out
          npm run build 2>&1 | tee build_output.log
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-docs-build-log
          path: next-docs/build_output.log
          if-no-files-found: ignore

      - name: Validate Local Links
        working-directory: ./next-docs
        run: |
          # Use linkinator to check internal broken links only without failing the build.
          # We skip all 'http' links to only validate relative/local routing inside 'out'.
          npx linkinator ./out --recurse --skip "^http" || echo "Link validation caught broken links. Check the logs above."

      - name: Upload generated site artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: next-docs-site
          path: next-docs/out
          if-no-files-found: error

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1.5.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: zero-to-ai
          directory: next-docs/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}

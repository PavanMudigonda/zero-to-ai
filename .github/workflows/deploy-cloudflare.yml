name: Deploy Next.js to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Required GitHub Actions secrets for this workflow:
  # - CLOUDFLARE_API_TOKEN
  # - CLOUDFLARE_ACCOUNT_ID
  # - NEXT_PUBLIC_SUPABASE_URL
  # - NEXT_PUBLIC_SUPABASE_ANON_KEY
  # Optional GitHub Actions secrets:
  # - GOOGLE_ANALYTICS_ID
  # - GOOGLE_SITE_VERIFICATION
  # Google OAuth provider client credentials are configured in Supabase Auth,
  # not injected into this static site build.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
                    
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: 'next-docs/package-lock.json'

      - name: Install dependencies
        working-directory: ./next-docs
        run: npm ci

      - name: Restore Next.js cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            next-docs/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('next-docs/package-lock.json') }}-${{ hashFiles('next-docs/src/**') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('next-docs/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Allocate swap space
        run: |
          sudo fallocate -l 16G /swapfile-new
          sudo chmod 600 /swapfile-new
          sudo mkswap /swapfile-new
          sudo swapon /swapfile-new

      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0

          for secret_name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_ANON_KEY
          do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required GitHub Actions secret: ${secret_name}" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing repository secrets before rerunning this workflow." >&2
            exit 1
          fi

      - name: Build Next.js site
        working-directory: ./next-docs
        run: |
          set -o pipefail
          rm -rf out
          npm run build 2>&1 | tee build_output.log
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Validate Local Links
        working-directory: ./next-docs
        run: |
          # Use linkinator to check internal broken links only without failing the build.
          # We skip all 'http' links to only validate relative/local routing inside 'out'.
          npx linkinator ./out --recurse --skip "^http" --concurrency 250 || echo "Link validation caught broken links. Check the logs above."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy next-docs/out --project-name=zero-to-ai --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

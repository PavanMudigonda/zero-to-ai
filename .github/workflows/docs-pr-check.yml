name: Docs Site PR Check

on:
  pull_request:
    paths:
      - 'next-docs/**'
      - '.github/workflows/docs-pr-check.yml'
  workflow_dispatch:

# Cancel superseded runs on the same PR branch to save CI minutes.
concurrency:
  group: docs-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: 'next-docs/package-lock.json'

      - name: Install dependencies
        working-directory: ./next-docs
        run: npm ci

      - name: Lint
        working-directory: ./next-docs
        run: npm run lint

      - name: Typecheck
        working-directory: ./next-docs
        run: npx tsc --noEmit

  build:
    name: Build (static export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: 'next-docs/package-lock.json'

      - name: Install dependencies
        working-directory: ./next-docs
        run: npm ci

      - name: Restore Next.js cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            next-docs/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('next-docs/package-lock.json') }}-${{ hashFiles('next-docs/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('next-docs/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Allocate swap space
        run: |
          sudo fallocate -l 16G /swapfile-new
          sudo chmod 600 /swapfile-new
          sudo mkswap /swapfile-new
          sudo swapon /swapfile-new

      - name: Build Next.js site
        working-directory: ./next-docs
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"

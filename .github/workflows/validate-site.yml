name: Validate Docs Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-site:
    runs-on: ubuntu-latest
    env:
      JUPYTER_PLATFORM_DIRS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Restore MkDocs notebook cache
        uses: actions/cache@v4
        with:
          path: .cache/mkdocs-jupyter
          key: ${{ runner.os }}-mkdocs-jupyter-${{ hashFiles('requirements-docs.txt', 'mkdocs.yml', 'scripts/build_site.sh') }}
          restore-keys: |
            ${{ runner.os }}-mkdocs-jupyter-

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build curriculum tree
        run: bash scripts/build_site.sh

      - name: MkDocs build
        run: mkdocs build

name: Validate Notebooks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'jupyter-notebooks/**/*.ipynb'
      - '.github/workflows/validate-notebooks.yml'

# Cancel superseded runs on the same PR branch to save CI minutes.
concurrency:
  group: validate-notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install validation tooling
      # Structural validation only needs nbformat; the heavy ML stack
      # (torch/transformers/...) is intentionally NOT installed here because
      # these checks never execute notebook code.
      run: |
        python -m pip install --upgrade pip
        pip install nbformat

    - name: Validate notebook structure
      run: |
        python -c "
        import nbformat
        from pathlib import Path

        errors = []
        notebooks = sorted(
            nb for nb in Path('jupyter-notebooks').rglob('*.ipynb')
            if '.ipynb_checkpoints' not in str(nb)
        )
        print(f'Found {len(notebooks)} notebooks')

        for nb_path in notebooks:
            try:
                with open(nb_path) as f:
                    nbformat.read(f, as_version=4)
            except Exception as e:
                errors.append(f'{nb_path}: {e}')
                print(f'✗ {nb_path}: {e}')

        if errors:
            print(f'\n❌ {len(errors)} notebooks have structural errors')
            for err in errors:
                print(f'  - {err}')
            exit(1)
        print(f'\n✅ All {len(notebooks)} notebooks are structurally sound')
        "

    - name: Enforce notebook size limit
      # Large committed notebooks usually mean saved outputs/binary blobs that
      # bloat the repo. Keep them out by failing the build above a hard cap.
      run: |
        python -c "
        import sys
        from pathlib import Path

        MAX_MB = 10
        oversized = []
        for nb_path in Path('jupyter-notebooks').rglob('*.ipynb'):
            if '.ipynb_checkpoints' in str(nb_path):
                continue
            size_mb = nb_path.stat().st_size / 1024 / 1024
            if size_mb > MAX_MB:
                oversized.append((str(nb_path), f'{size_mb:.1f}MB'))

        if oversized:
            print(f'❌ {len(oversized)} notebooks exceed {MAX_MB}MB:')
            for path, size in oversized:
                print(f'  - {path}: {size}')
            print('Clear outputs (e.g. nbstripout) before committing.')
            sys.exit(1)
        print(f'✅ No notebooks exceed {MAX_MB}MB')
        "

    - name: Summary
      if: always()
      run: |
        NOTEBOOK_COUNT=$(find jupyter-notebooks -name '*.ipynb' -not -path '*/.ipynb_checkpoints/*' | wc -l | tr -d ' ')
        {
          echo "## Validation Summary"
          echo "- Python version: ${{ matrix.python-version }}"
          echo "- Notebooks checked: ${NOTEBOOK_COUNT}"
          echo "- Structural validation: nbformat schema check"
          echo "- Size guardrail: fail if any notebook > 10MB"
          echo ""
          echo "Note: Full execution testing requires API keys and GPU resources and is out of scope for this gate."
        } >> "$GITHUB_STEP_SUMMARY"

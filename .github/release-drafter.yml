name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
template: |
  ## What's Changed

  $CHANGES
categories:
  - title: '🚀 Features'
    semver-increment: minor
    when:
      labels:
        - 'feature'
        - 'enhancement'
  - title: '🐛 Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bugfix'
        - 'bug'
  - title: '📚 Documentation'
    when:
      labels:
        - 'documentation'
        - 'docs'
  - title: '🧰 Maintenance'
    when:
      labels:
        - 'chore'
        - 'maintenance'
        - 'dependencies'
  - type: 'version-resolver'
    semver-increment: major
    when:
      labels:
        - 'major'
  - type: 'version-resolver'
    semver-increment: minor
    when:
      labels:
        - 'minor'
        - 'feature'
        - 'enhancement'
  - type: 'version-resolver'
    semver-increment: patch
    when:
      labels:
        - 'patch'
        - 'fix'
        - 'bugfix'
        - 'docs'
        - 'documentation'
        - 'chore'
version-resolver:
  default: patch
